<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#facc15" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Shield / Rounded Base with Gold Border -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4.5" />

  <!-- Subtle Cyan Accent Lines -->
  <path d="M12 28 H24 M104 28 H116" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M12 100 H24 M104 100 H116" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Top "NGD" Squad Badge Header -->
  <text x="64" y="24" text-anchor="middle" fill="#00f2fe" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="800" letter-spacing="1">MLBB 5V5</text>

  <!-- Geometric NGD Letters (Enhanced for high visibility in 16px/32px browser tabs) -->
  <g filter="url(#glow)">
    <!-- Letter N -->
    <path d="M20 90 V40 H30 L45 70 V40 H55 V90 H45 L30 60 V90 Z" fill="url(#goldGrad)" />

    <!-- Letter G -->
    <path d="M82 40 H61 C58 40 56 42 56 45 V85 C56 88 58 90 61 90 H82 C85 90 87 88 87 85 V62 H72 V72 H77 V80 H66 V50 H82 Z" fill="url(#goldGrad)" />

    <!-- Letter D -->
    <path d="M91 40 H103 C111 40 116 46 116 65 C116 84 111 90 103 90 H91 Z M101 50 V80 H103 C107 80 109 76 109 65 C109 54 107 50 103 50 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Bottom Brand Text -->
  <text x="64" y="106" text-anchor="middle" fill="#fde047" font-size="10" font-family="sans-serif" font-weight="900" letter-spacing="0.5">NEXTGEN</text>
  <circle cx="64" cy="116" r="2.5" fill="#00f2fe" />
</svg>
